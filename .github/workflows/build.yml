name: Build and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-non-macos:
    name: Export Windows, Linux, and Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Wine for Windows icon resources
        id: wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes wine64 wine32
          echo "path=$(which wine)" >> "$GITHUB_OUTPUT"

      - name: Export Godot builds
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Web,Windows Desktop,Linux
          archive_output: true
          archive_root_folder: true
          cache: true
          wine_path: ${{ steps.wine.outputs.path }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: almost-non-macos-${{ github.sha }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error

  build-macos:
    name: Export macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Godot and export templates
        run: |
          curl --fail --location --silent --show-error --output godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip
          unzip -q godot.zip
          mv Godot.app "$RUNNER_TEMP/Godot.app"
          curl --fail --location --silent --show-error --output templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          mv "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable/"
          echo "$RUNNER_TEMP/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: Export macOS app
        run: |
          mkdir -p dist/macos
          Godot --headless --path . --export-release macOS dist/macos/almost.app

      - name: Import Apple signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/apple-signing.keychain-db"
          KEYCHAIN_PASSWORD="${{ github.run_id }}-${{ github.run_attempt }}"
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign and notarize macOS app
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP_PATH="dist/macos/almost.app"
          PACKAGE_PATH="dist/macos/almost.zip"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          test -n "$SIGNING_IDENTITY"
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$PACKAGE_PATH"
          xcrun notarytool submit "$PACKAGE_PATH" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"

      - name: Package macOS app
        run: |
          rm -f dist/macos/almost.zip
          ditto -c -k --keepParent dist/macos/almost.app dist/macos/almost.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: almost-macos-${{ github.sha }}
          path: dist/macos/almost.zip
          if-no-files-found: error

  deploy-pages:
    name: Deploy Web build to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-non-macos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Export Web build
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Web
          relative_export_path: pages
          cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-non-macos
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: almost-*
          merge-multiple: true
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/**
